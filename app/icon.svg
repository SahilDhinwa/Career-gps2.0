      C 56 255 72 261 89 263.8
      L 82.8 275
      C 76.6 286.1 68 291 56 291
      H 17
      L 42.5 245.2
      Z
    "
  />

  <!-- Right leg -->
  <path
    fill="url(#atreya-letter-gradient)"
