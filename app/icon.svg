
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 1200"
     width="1200"
     height="1200"
     fill="none"
     role="img"
     aria-labelledby="atreya-title atreya-desc">
  <title id="atreya-title">ATREYA Infinity Emblem</title>
  <desc id="atreya-desc">Interwoven golden and emerald infinity ribbons surrounded by botanical leaves, a golden halo, and luminous droplets.</desc>

  <defs>
    <!-- Metallic gold -->
    <linearGradient id="inf-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E4A0C"/>
      <stop offset=".12" stop-color="#D9972D"/>
      <stop offset=".24" stop-color="#FFF5B5"/>
      <stop offset=".37" stop-color="#F8D875"/>
      <stop offset=".53" stop-color="#BC7620"/>
      <stop offset=".69" stop-color="#F9D270"/>
      <stop offset=".83" stop-color="#FFF0A3"/>
      <stop offset="1" stop-color="#96500E"/>
    </linearGradient>

    <linearGradient id="inf-gold-face"
                    x1="0" y1="0" x2=".25" y2="1">
      <stop offset="0" stop-color="#FFF6BC"/>
      <stop offset=".18" stop-color="#FFE18C"/>
      <stop offset=".46" stop-color="#D18C2B"/>
      <stop offset=".67" stop-color="#F4C362"/>
      <stop offset=".84" stop-color="#A55D14"/>
      <stop offset="1" stop-color="#F8D77B"/>
    </linearGradient>

    <linearGradient id="inf-gold-edge"
                    x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8F4B13"/>
      <stop offset=".25" stop-color="#E6AB48"/>
      <stop offset=".5" stop-color="#FFF8CE"/>
      <stop offset=".78" stop-color="#E9AD45"/>
      <stop offset="1" stop-color="#7D430F"/>
    </linearGradient>

    <!-- Emerald ribbon -->
    <linearGradient id="inf-green"
                    x1=".1" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#B9D86D"/>
      <stop offset=".15" stop-color="#61B15B"/>
      <stop offset=".34" stop-color="#0E7546"/>
      <stop offset=".54" stop-color="#00472F"/>
      <stop offset=".72" stop-color="#00351F"/>
      <stop offset=".87" stop-color="#167B49"/>
      <stop offset="1" stop-color="#8FBD60"/>
    </linearGradient>

    <linearGradient id="inf-green-face"
                    x1="0" y1="0" x2=".65" y2="1">
      <stop offset="0" stop-color="#D4E58B"/>
      <stop offset=".18" stop-color="#84BC65"/>
      <stop offset=".36" stop-color="#2B9955"/>
      <stop offset=".58" stop-color="#075638"/>
      <stop offset=".82" stop-color="#003C29"/>
      <stop offset="1" stop-color="#2B9854"/>
    </linearGradient>

    <linearGradient id="inf-green-dark"
                    x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#185C37"/>
      <stop offset=".5" stop-color="#00301F"/>
      <stop offset="1" stop-color="#0D6A43"/>
    </linearGradient>

    <!-- Botanical leaves -->
    <linearGradient id="inf-leaf"
                    x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4E69A"/>
      <stop offset=".17" stop-color="#98C668"/>
      <stop offset=".42" stop-color="#348C4E"/>
      <stop offset=".7" stop-color="#075B39"/>
      <stop offset="1" stop-color="#002D21"/>
    </linearGradient>

    <linearGradient id="inf-leaf-right"
                    x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E5E99C"/>
      <stop offset=".3" stop-color="#75B45E"/>
      <stop offset=".65" stop-color="#116D40"/>
      <stop offset="1" stop-color="#003621"/>
    </linearGradient>

    <linearGradient id="inf-leaf-top"
                    x1=".05" y1=".05" x2=".95" y2="1">
      <stop offset="0" stop-color="#FFF4B2"/>
      <stop offset=".18" stop-color="#B9D77C"/>
      <stop offset=".45" stop-color="#3C9A51"/>
      <stop offset=".73" stop-color="#08613C"/>
      <stop offset="1" stop-color="#002C20"/>
    </linearGradient>

    <!-- Halo -->
    <linearGradient id="inf-halo"
                    x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9621B"/>
      <stop offset=".18" stop-color="#FFE9A0"/>
      <stop offset=".38" stop-color="#E8A94C"/>
      <stop offset=".52" stop-color="#FFF7CB"/>
      <stop offset=".75" stop-color="#CB8229"/>
      <stop offset="1" stop-color="#8C4912"/>
    </linearGradient>

    <!-- Golden droplets -->
    <linearGradient id="inf-droplet"
                    x1=".12" y1=".06" x2=".85" y2=".92">
      <stop offset="0" stop-color="#FFF9D6"/>
      <stop offset=".2" stop-color="#FFE99B"/>
      <stop offset=".44" stop-color="#F0BE54"/>
      <stop offset=".7" stop-color="#A65E14"/>
      <stop offset=".88" stop-color="#D99128"/>
      <stop offset="1" stop-color="#FFF0A3"/>
    </linearGradient>

    <radialGradient id="inf-orb"
                    cx=".3" cy=".22" r=".85">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".16" stop-color="#FFF8CB"/>
      <stop offset=".37" stop-color="#FFD875"/>
      <stop offset=".66" stop-color="#D38B25"/>
      <stop offset=".85" stop-color="#9B510D"/>
      <stop offset="1" stop-color="#F6C65D"/>
    </radialGradient>

    <linearGradient id="inf-vein"
                    x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7BE"/>
      <stop offset=".5" stop-color="#D8B961"/>
      <stop offset="1" stop-color="#5B9F57"/>
    </linearGradient>

    <filter id="inf-soft-glow"
            x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <filter id="inf-small-glow"
            x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <filter id="inf-drop-shadow"
            x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"
                      result="blur"/>
      <feOffset dy="7" result="offset"/>
      <feComponentTransfer in="offset" result="shadow">
        <feFuncA type="linear" slope=".35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

