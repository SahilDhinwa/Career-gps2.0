<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 370 305"
  fill="none"
  role="img"
  aria-labelledby="atreya-icon-title"
>
  <title id="atreya-icon-title">
    ATREYA Botanical A Emblem
  </title>

  <defs>
    <linearGradient
      id="atreya-letter-gradient"
      x1="0.35"
      y1="0"
      x2="0.65"
      y2="1"
    >
      <stop offset="0%" stop-color="#149680"/>
      <stop offset="48%" stop-color="#086D61"/>
      <stop offset="100%" stop-color="#023B36"/>
    </linearGradient>

    <linearGradient
      id="atreya-leaf-gradient"
      x1="0"
      y1="0.85"
      x2="0.95"
      y2="0.2"
    >
      <stop offset="0%" stop-color="#55AE54"/>
      <stop offset="55%" stop-color="#7BC356"/>
      <stop offset="85%" stop-color="#8BCE58"/>
      <stop offset="100%" stop-color="#6BB955"/>
    </linearGradient>
  </defs>

  <!-- Upper body of the A -->
  <path
